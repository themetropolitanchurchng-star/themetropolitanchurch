<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | The Metropolitan Church, Ibadan</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-login-page">
    <main class="admin-login-shell">
        <div class="admin-login-brand">
            <img src="LOGO TMC.png" alt="The Metropolitan Church logo" class="admin-login-logo">
            <span>The Metropolitan Church</span>
        </div>

        <section class="admin-login-card" aria-labelledby="adminLoginTitle">
            <div class="admin-login-heading">
                <span class="admin-login-status"><span aria-hidden="true"></span> Secure admin access</span>
                <h1 id="adminLoginTitle">Welcome back</h1>
                <p>Sign in to manage believer records.</p>
            </div>

            <form id="adminLoginForm" class="auth-form admin-login-form" autocomplete="off">
                <label for="adminUsername">
                    Username
                    <input type="text" id="adminUsername" autocomplete="username" autocapitalize="none" required>
                </label>
                <label for="adminPassword">
                    Password
                    <span class="admin-password-field">
                        <input type="password" id="adminPassword" autocomplete="current-password" required>
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" aria-pressed="false">Show</button>
                    </span>
                </label>
                <p id="loginError" class="login-error" aria-live="polite"></p>
                <button type="submit" class="admin-login-submit">Sign in <span aria-hidden="true">&#8594;</span></button>
            </form>

            <a href="index.html" class="admin-login-back">&#8592; Back to messages</a>
        </section>

        <p class="admin-login-footer">Authorized administrators only</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
